<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groq RAG Assistant</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#6b7280;--card:#f6f7f9;--bd:#e3e5e8;--acc:#f55036;--usr:#fde8e4}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e8eaed;--mut:#9aa0a6;--card:#1f2227;--bd:#33373d;--usr:#3a2420}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);display:flex;height:100vh}
aside{width:290px;padding:18px;border-right:1px solid var(--bd);background:var(--card);overflow:auto}
main{flex:1;display:flex;flex-direction:column;min-width:0}
h1{font-size:18px;margin:0 0 4px}h3{font-size:13px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input[type=password],input[type=file]{width:100%;margin-bottom:8px}input[type=password]{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:default}
#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:780px;padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--usr)}.bot{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
details{margin-top:8px;font-size:13px;color:var(--mut)}details p{margin:6px 0}
form{display:flex;gap:8px;padding:14px;border-top:1px solid var(--bd)}form input{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font-size:15px}
#src,#msg{font-size:13px;color:var(--mut)}
</style></head><body>
<aside>
  <h1>📚 Groq RAG</h1><div style="color:var(--mut);font-size:13px">Chat with your documents</div>
  <h3>API key</h3>
  <input id="key" type="password" placeholder="gsk_... (optional if set in .env)">
  <h3>Documents</h3>
  <input id="files" type="file" accept=".pdf,.txt,.md" multiple>
  <button id="up">Index documents</button>
  <div id="msg" style="margin-top:8px"></div>
  <h3>Indexed</h3><div id="src">none yet</div>
  <button class="sec" id="clr" style="margin-top:10px">Clear knowledge base</button>
</aside>
<main>
  <div id="chat"><div class="msg bot">Upload a PDF or text file, click <b>Index documents</b>, then ask me anything about it.</div></div>
  <form id="f"><input id="q" placeholder="Ask something about your documents..." autocomplete="off"><button id="go">Send</button></form>
</main>
<script>
const $=id=>document.getElementById(id);let history=[];
$("key").value=localStorage.getItem("groq_key")||"";
$("key").oninput=()=>localStorage.setItem("groq_key",$("key").value);
async function api(path,body){const r=await fetch(path,body?{method:"POST",body:JSON.stringify(body)}:{});
  const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j}
function showSources(s){$("src").textContent=s.length?s.join(", "):"none yet"}
api("/api/status").then(j=>showSources(j.sources));
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
$("up").onclick=async()=>{const fs=[...$("files").files];if(!fs.length){$("msg").textContent="Choose a file first.";return}
  $("up").disabled=true;let total=0;
  try{for(const f of fs){$("msg").textContent="Indexing "+f.name+"...";const j=await api("/api/upload",{name:f.name,data:await b64(f)});total+=j.chunks;showSources(j.sources)}
    $("msg").textContent="Indexed "+total+" chunks."}catch(e){$("msg").textContent="Error: "+e.message}
  $("up").disabled=false};
$("clr").onclick=async()=>{const j=await api("/api/clear",{});showSources(j.sources);history=[];$("msg").textContent="Cleared."};
$("f").onsubmit=async e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;$("q").value="";add("user",q);
  const w=add("bot","Thinking...");$("go").disabled=true;
  try{const j=await api("/api/ask",{question:q,history,api_key:$("key").value});w.textContent=j.answer;
    if(j.sources.length){const d=document.createElement("details");const s=document.createElement("summary");s.textContent="Sources ("+j.sources.length+")";d.appendChild(s);
      j.sources.forEach(h=>{const p=document.createElement("p");p.textContent=h.source+" · page "+h.page+" — "+h.text.slice(0,220)+"...";d.appendChild(p)});w.appendChild(d)}
    history.push({role:"user",content:q},{role:"assistant",content:j.answer})}
  catch(err){w.textContent="⚠️ "+err.message}
  $("go").disabled=false;$("chat").scrollTop=1e9};
</script></body></html>
